<!DOCTYPE html>
<html>

<head>
    <title>Register - Campus Lost and Found Portal</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">

        <h1>Campus Lost and Found Portal</h1>
        <h2>Register</h2>

        <form id="registerForm">
            <label>Name:</label>
            <input id="inputName" type="text" name="name" required>

            <label for="role">Role:</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="staff">Staff</option>
            </select>

            <label>College Email:</label>
            <input id="inputEmail" type="email" name="email" required>

            <label>Password:</label>
            <input id="inputPass" type="password" name="password" required>

            <label>Confirm Password:</label>
            <input id="confirmPass" type="password" name="confirm_password" required>

            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="http://localhost:8000/user/login">Login here</a></p>

    </div>
    <script src="../js/register.js"></script>
</body>

</html>
