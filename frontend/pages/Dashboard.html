<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Find</title>
    <link rel="stylesheet" href="../css/ReportForm.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="7" stroke-width="2.5"></circle>
            <line x1="15" y1="15" x2="22" y2="22" stroke-width="3.2"></line>
            <path d="M9 5.5 A 4.5 4.5 0 0 1 14.5 11" stroke-width="1.5"></path>
            </svg>
            Campus Find
        </div>
        <ul class="nav-links">
            <li><a href="/user/dashboard" class="active">Dashboard</a></li>
            <li><a href="/item/lost">Lost Items</a></li>
            <li><a href="/item/found">Found Items</a></li>
            {% if user_role == "admin" %}
            <li><a href="/report" class="nav-btn admin-btn">Admin Panel</a></li>
            {% endif %}
            <li><a href="/user/profile"><button class="nav-btn profile-btn">{{ user_name }}</button></a></li>
            <li><a href="/user/logout" class="signout-link">Sign Out</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <!-- Pretty Welcome Banner -->
        <div class="welcome-banner">
            <h1>Welcome to Campus Find, {{ user_name }}! 👋</h1>
            <p>IIT Bhilai's official portal to report and recover your items securely.</p>
            <button id="btnReportItem" class="btn-report-main">Report Item</button>
            <div id="modal-container"></div>
            <script src="../js/ReportForm.js"></script>
        </div>
    </main>
    
    
</body>
</html>
