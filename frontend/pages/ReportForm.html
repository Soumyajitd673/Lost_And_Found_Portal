<div id="itemModal" class="modal-overlay">
    <div class="report-container">
        <div class="report-header" id="formHeader">
            <h2 id="modalTitle">Report a Lost Item</h2>
            <p id="modalSubtitle">Provide as much detail as possible to help find your item.</p>
        </div>

        <form id="itemForm">
            <div class="report-grp radio-group">
                <label class="radio-label">
                    <input type="radio" name="reportType" value="lost" checked> Report Lost
                </label>
                <label class="radio-label">
                    <input type="radio" name="reportType" value="found"> Report Found
                </label>
            </div>

            <div class="report-grp">
                <label for="itemName">Item Name <span class="required">*</span></label>
                <input type="text" id="itemName" name="itemName" required placeholder="e.g., Casio Scientific Calculator">
            </div>

            <div class="report-row">
                <div class="report-grp half">
                    <label for="category">Category <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Electronics & Gadgets">Electronics & Gadgets</option>
                        <option value="Documents & IDs">Documents & IDs</option>
                        <option value="Wallets, money and cards">Wallets, money and cards</option>
                        <option value="Bags and carriers">Bags and carriers</option>
                        <option value="Keys and access items">Keys and access items</option>
                        <option value="Clothing & Footwear">Clothing & Footwear</option>
                        <option value="Academic & Lab Items">Academic & Lab Items</option>
                        <option value="Accessories and jewelleries">Accessories and jewelleries</option>
                        <option value="Sports and fitness gear">Sports and fitness gear</option>
                        <option value="Vehicles and vehicle accessories">Vehicles and vehicle accessories</option>
                        <option value="Personal Care & Health items">Personal Care & Health items</option>
                        <option value="Food, drink and utensils">Food, drink and utensils</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
            </div>

            <div class="report-row">
                <div class="report-grp half" id="locationWrapper" style="width: 100%;">
                    <label for="location" id="labelLocation">Last Known Location <span class="required">*</span></label>
                    <input type="text" id="location" name="location" required placeholder="e.g., L-320, ED1">
                </div>
            </div>

            <div class="report-grp">
                <label for="description">Detailed Description (Optional)</label>
                <textarea id="description" name="description" rows="3" placeholder="Distinguishing marks, colors, or specific details..."></textarea>
            </div>


            <div class="report-grp">
                <label for="itemImage">Upload Image <span class="required">*</span></label>
                <div class="file-upload-box">
                    <input type="file" id="itemImage" name="itemImage" accept="image/*">
                </div>
            </div>

            <div class="report-actions">
                <button type="button" class="btn-secondary" id="closeFormBtn">Cancel</button>
                <button type="submit" class="btn-primary" id="submitBtn">Submit Report</button>
            </div>
        </form>

        <div id="successMessage" class="hidden alert-success">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 10px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <p>Your report has been successfully submitted!</p>
        </div>
    </div>
</div>
